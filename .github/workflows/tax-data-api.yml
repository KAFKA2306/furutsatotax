name: Tax data API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install runtime dependency
        run: python -m pip install PyYAML
      - name: Compile
        run: python -m compileall scripts tests
      - name: Python calculation tests
        run: python -m unittest discover -s tests -v
      - name: Browser calculation tests
        run: node tests/test_web_tax_core.js
      - name: Build API
        run: python scripts/build_tax_data_api.py --out public-api/v1
      - name: Smoke test and verify committed Pages distribution
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          p = Path('public-api/v1')
          published = Path('docs/api/v1')
          manifest = json.loads((p / 'manifest.json').read_text())
          payload = json.loads((p / 'parameters.json').read_text())
          rows = list(csv.DictReader((p / 'parameters.csv').open()))
          assert payload['tax_year'] == 2026
          assert len(payload['salary_income_rules']) == 9
          assert len(payload['income_tax_brackets']) == 7
          assert len(rows) == 16
          assert manifest['record_counts'] == {'salary_income_rules': 9, 'income_tax_brackets': 7}
          for name, metadata in manifest['files'].items():
              data = (p / name).read_bytes()
              assert len(data) == metadata['bytes']
              assert hashlib.sha256(data).hexdigest() == metadata['sha256']
          for name in ('parameters.json', 'parameters.csv', 'manifest.json'):
              assert (p / name).read_bytes() == (published / name).read_bytes(), name
          print({'records': len(rows), 'tax_year': payload['tax_year'], 'published_files': 3})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: furusato-tax-data-api-v1
          path: public-api/v1
          retention-days: 30
