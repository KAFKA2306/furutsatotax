name: Deploy MkDocs to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          python -m pip install PyYAML mkdocs mkdocs-material
      - name: Verify calculation cores before public deploy
        run: |
          python -m compileall scripts tests
          python -m unittest discover -s tests -v
          node tests/test_web_tax_core.js
      - name: Build MkDocs site
        run: mkdocs build
      - name: Copy web files to deploy directory
        run: |
          mkdir -p deploy
          cp -r web/* deploy/
          # MkDocsサイトは /mkdocs/ サブディレクトリに配置
          cp -r web/mkdocs/* deploy/mkdocs/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: deploy
      - uses: actions/deploy-pages@v4
