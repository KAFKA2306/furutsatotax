name: Deploy MkDocs to Pages

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install PyYAML mkdocs mkdocs-material playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify canonical Python calculation boundary before public deploy
        run: |
          python -m compileall scripts tests
          python -m unittest discover -s tests -v
      - name: Build MkDocs site
        run: mkdocs build
      - name: Copy web files and canonical Python sources to deploy directory
        run: |
          mkdir -p deploy/python
          cp -r web/* deploy/
          cp scripts/calc_furusato.py scripts/pyodide_api.py deploy/python/
          # MkDocsサイトは /mkdocs/ サブディレクトリに配置
          cp -r web/mkdocs/* deploy/mkdocs/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push'
        with:
          path: deploy
      - name: Verify checkout clean
        run: |
          find scripts tests -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf deploy web/mkdocs
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/deploy-pages@v4
        if: github.event_name == 'push'
